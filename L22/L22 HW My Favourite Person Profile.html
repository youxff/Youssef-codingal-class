<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L22 HW My Favourite Person Profile</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {
                background-color: lightcyan;
            }

            h1 {
                color: red;
            }

            .card-label {
                font-size: 11px;
                color: blue;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body class="py-4">
        <div class="container">
            <h1 class="mb-1">My Favourite Person</h1>
            <p class="text-muted mb-4">
                they're description
            </p>

            <!-- Contact Card -->
            <div class="card shadow-sm mb-3" style="max-width: 400px;">
                <div class="card-body">
                    <h5 class="card-title" style="color: #FF5A43;">Favourite Person Details</h5>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label d-block">Relation</span>
                            <strong id="relation">-</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label d-block">School</span>
                            <strong id="school">-</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label d-block">nationality</span>
                            <strong id="nationality">-</strong>
                        </li>
                    </ul>
                </div>
            </div> 
        </div><!-- /container -->

        <script>
            // Step 1 - Create the contact object
            var myContact = {
                name:   "Adam Elmowafy",
                relation:   "Bro",
                school:   "Royal British International",
                nationality:  "Egypt"
            };

            // Step 2 - Dot notation
            var nameEl = document.getElementById("name");
            var relationEl = document.getElementById("relation");

            nameEl.textContent = myContact.name;
            relationEl.textContent = myContact.relation;

            // Step 3 - Bracket notation
            var schoolEl = document.getElementById("school");
            var nationalityEl = document.getElementById("nationality");

            schoolEl.textContent = myContact["school"];
            nationalityEl.textContent = myContact["nationality"];
        </script>
    </body>
</html>
