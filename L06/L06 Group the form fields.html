<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L06 Group the form fields</title>
    </head>
    <body>
        <fieldset>
            <legend>
                Personal Detail Form
            </legend>

            <form>
                <label>Name</label> <br>
                <input type="text" id="name"> <br><br>

                <label>Email ID</label> <br>
                <input type="text" id="email"> <br><br>

                <label>Password (this will be hidden)</label> <br>
                <input type="password" id="contact"> <br><br>

                <label>Gender</label><br>
                <input type="radio" id="female" name="Gender" value="Female">Female <br>
                <input type="radio" id="male" name="Gender" value="Male">Male <br><br>

                <label>Favourite City</label><br>
                <input type="checkbox" id="City" value="Cairo">Cairo<br>
                <input type="checkbox" id="City" value="Alexandria">Alexandria<br><br>

                <label>Birthday:</label>
                <input type="date" id="birthday"><br><br>

                <input type="submit">
            </form>
        </fieldset>
    </body>
</html>
