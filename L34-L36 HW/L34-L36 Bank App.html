<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank App</title>

    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    padding: 0;
}

.container {
    width: 80%;
    max-width: 600px;
    margin: 50px auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.row {
    margin-bottom: 20px;
}

h3 {
    text-align: center;
    font-size: 28px;
    color: #333;
    margin-bottom: 30px;
}

label {
    font-size: 18px;
    display: inline-block;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.buttons {
    display: flex;
    gap: 10px;
}

.btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    background-color: #0056b3;
}

#balance {
    font-weight: bold;
    color: green;
    margin-left: 5px;
}

#message {
    font-size: 18px;
    font-weight: bold;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <h3> Al FEB Bank App</h3>
        </div>
        <div class="row">
            <label>Enter Transaction Amount</label>
            <input type="number" id="amount"></input>
        </div>
        <div class="row buttons">
            <button id="credit" class="btn">Credit</button>
            <button id="debit" class="btn">Debit</button>
            <button id="cash" class="btn">Cash Amount</button>
        </div>
        <div class="row">
            <label>Your Account Balance is : Rp.</label>
            <label id="balance">$10000000</label>
        </div>
        <div class="row">
            <label id="message"></label>
        </div>
    </div>

    <script>
    let balance = 100000;

    document.getElementById("credit").onclick = function() {
        let amount = Number(document.getElementById("amount").value);

        if (amount > 0) {
            balance = balance + amount;
            document.getElementById("balance").textContent = balance;
            document.getElementById("message").textContent = "Money credited successfully!";
        } else {
            document.getElementById("message").textContent = "Please enter an amount.";
        }
    };

    document.getElementById("debit").onclick = function() {
        let amount = Number(document.getElementById("amount").value);

        if (amount > 0) {
            if (amount <= balance) {
                balance = balance - amount;
                document.getElementById("balance").textContent = balance;
                document.getElementById("message").textContent = "Money debited successfully!";
            } else {
                document.getElementById("message").textContent = "Insufficient balance.";
            }
        } else {
            document.getElementById("message").textContent = "Please enter an amount.";
        }
    };

    document.getElementById("cash").onclick = function() {
        document.getElementById("balance").textContent = balance;
        document.getElementById("message").textContent = "Your current balance is shown above.";
    };
</script>
</body>
</html>
