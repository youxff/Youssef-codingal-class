<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al FEB Bank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 5px 0 0;
            color: #cbd5e1;
        }

        .logo {
            background: white;
            color: #203a43;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .balance-card p {
            margin: 0 0 10px;
            opacity: 0.8;
        }

        .balance {
            font-size: 40px;
            font-weight: bold;
            margin: 10px 0;
        }

        .account-number {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Main Card */
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #007bff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .credit {
            background: #16a34a;
            color: white;
        }

        .credit:hover {
            background: #15803d;
        }

        .debit {
            background: #dc2626;
            color: white;
        }

        .debit:hover {
            background: #b91c1c;
        }

        .cash {
            background: #007bff;
            color: white;
        }

        .cash:hover {
            background: #0056b3;
        }

        .clear {
            background: #e2e8f0;
            color: #334155;
            width: 100%;
            margin-top: 10px;
        }

        .clear:hover {
            background: #cbd5e1;
        }

        /* Message */
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        /* Transaction History */
        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-name {
            font-weight: bold;
        }

        .transaction-date {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .credit-text {
            color: #16a34a;
            font-weight: bold;
        }

        .debit-text {
            color: #dc2626;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .header h1 {
                font-size: 22px;
            }

            .balance {
                font-size: 30px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div>
                <h1>Al FEB Bank</h1>
                <p>Welcome back 👋</p>
            </div>

            <div class="logo">
                AF
            </div>
        </div>


        <!-- Balance -->
        <div class="balance-card">

            <p>Available Balance</p>

            <div class="balance" id="balance">
                Rp. 100,000
            </div>

            <div class="account-number">
                Account: **** 4582
            </div>

        </div>


        <!-- Transaction Card -->
        <div class="card">

            <h2>Make a Transaction</h2>

            <label for="amount">
                Transaction Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
            >

            <div class="buttons">

                <button class="credit" id="credit">
                    + Credit
                </button>

                <button class="debit" id="debit">
                    − Debit
                </button>

                <button class="cash" id="cash">
                    💰 Check Balance
                </button>

            </div>

            <button class="clear" id="clear">
                Clear Amount
            </button>

            <div id="message"></div>

        </div>


        <!-- Transaction History -->
        <div class="card">

            <h2>Transaction History</h2>

            <div id="transactions">

                <div class="empty">
                    No transactions yet.
                </div>

            </div>

        </div>

    </div>


    <script>

        // Starting balance
        let balance = 100000;


        // Get HTML elements
        const amountInput = document.getElementById("amount");
        const balanceDisplay = document.getElementById("balance");
        const message = document.getElementById("message");
        const transactions = document.getElementById("transactions");


        // Format money
        function formatMoney(amount) {

            return "Rp. " + amount.toLocaleString();

        }


        // Update balance
        function updateBalance() {

            balanceDisplay.textContent = formatMoney(balance);

        }


        // Show message
        function showMessage(text, type) {

            message.textContent = text;

            message.className = type;

        }


        // Add transaction to history
        function addTransaction(type, amount) {

            // Remove "No transactions yet"
            const emptyMessage =
                transactions.querySelector(".empty");

            if (emptyMessage) {
                emptyMessage.remove();
            }


            const transaction =
                document.createElement("div");

            transaction.className = "transaction";


            const details =
                document.createElement("div");

            const name =
                document.createElement("div");

            name.className = "transaction-name";

            const date =
                document.createElement("div");

            date.className = "transaction-date";


            const amountDisplay =
                document.createElement("div");


            if (type === "credit") {

                name.textContent = "Money Credited";

                amountDisplay.textContent =
                    "+ " + formatMoney(amount);

                amountDisplay.className =
                    "credit-text";

            } else {

                name.textContent = "Money Debited";

                amountDisplay.textContent =
                    "- " + formatMoney(amount);

                amountDisplay.className =
                    "debit-text";

            }


            date.textContent =
                new Date().toLocaleTimeString();


            details.appendChild(name);

            details.appendChild(date);


            transaction.appendChild(details);

            transaction.appendChild(amountDisplay);


            transactions.prepend(transaction);

        }


        // CREDIT
        document.getElementById("credit").onclick =
            function() {

                let amount =
                    Number(amountInput.value);


                if (amount <= 0) {

                    showMessage(
                        "Please enter a valid amount.",
                        "error"
                    );

                    return;
                }


                balance += amount;


                updateBalance();


                showMessage(
                    "Money credited successfully!",
                    "success"
                );


                addTransaction(
                    "credit",
                    amount
                );


                amountInput.value = "";

            };


        // DEBIT
        document.getElementById("debit").onclick =
            function() {

                let amount =
                    Number(amountInput.value);


                if (amount <= 0) {

                    showMessage(
                        "Please enter a valid amount.",
                        "error"
                    );

                    return;
                }


                if (amount > balance) {

                    showMessage(
                        "Insufficient balance.",
                        "error"
                    );

                    return;
                }


                balance -= amount;


                updateBalance();


                showMessage(
                    "Money debited successfully!",
                    "success"
                );


                addTransaction(
                    "debit",
                    amount
                );


                amountInput.value = "";

            };


        // CHECK BALANCE
        document.getElementById("cash").onclick =
            function() {

                showMessage(
                    "Your current balance is " +
                    formatMoney(balance),
                    "success"
                );

            };


        // CLEAR INPUT
        document.getElementById("clear").onclick =
            function() {

                amountInput.value = "";

                message.textContent = "";

                message.className = "";

            };


        // Allow Enter key to check balance
        amountInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    document.getElementById("cash").click();

                }

            }
        );


        // Display starting balance
        updateBalance();

    </script>

</body>
</html>
