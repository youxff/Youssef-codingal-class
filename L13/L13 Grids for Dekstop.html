<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L13 Grids for Dekstop</title>

        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <div class="container-fluid">
            <h1>Large Grid</h1>
            <p>Dummy data</p>
            <p>Resize the browser window to see the effect.</p>

            <div class="row">
                <div class="col-lg-4" style="background-color: gold;">
                    dummy
                </div>

                <div class="col-lg-8" style="background-color: blue;">
                    dummy
                </div>
            </div>
            
            <div class="row">
                <div class="col" style="background-color: yellow;">
                    This is how to make different size columns
                </div>

                <div class="col" style="background-color: pink;">
                    and this is how to add background color as well to your column
                </div>

                <div class="col" style="background-color: cadetblue;">
                    this is how it looks like with 3 even colums in a row
                </div>
            </div> 
        </div>
    </body> 
</html>
