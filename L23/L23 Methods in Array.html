<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L23 Methods in Array</title>
    </head>
    <body>
        <h2>JavaScript Arrays</h2>
        <h2>join() and pop()</h2>

        <p>
            The join() method joins array elements into a string and the pop() method removes the last element from an array.
        </p>

        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <p id="mythirdpop"></p>
        <p id="myfourthpop"></p>
        <p id="myfifthpop"></p>

        <script>
            var fruits = ["Banana","Orange","Apple","Mango","Tomato","Cucumber","Pomgranate"];
            document.getElementById("myjoin").innerHTML = fruits.join(" * ");

            fruits.pop();
            document.getElementById("myfirstpop").innerHTML = fruits;

            fruits.pop();
            document.getElementById("mysecondpop").innerHTML = fruits;

            fruits.pop();
            document.getElementById("mythirdpop").innerHTML = fruits;

            fruits.pop();
            document.getElementById("myfourthpop").innerHTML = fruits;

            fruits.pop();
            document.getElementById("myfifthpop").innerHTML = fruits;
        </script>
    </body>
</html>
